sections: [hero, cards, cta]

hero:
  align: center
  eyebrow: evo-learn 数据库系统教程
  title_lines:
    - words: [{ text: 读懂数据库内核， }]
    - words: [{ text: 从 MySQL 8 到 TiDB。 }]
  lead: 从存储页、B+ 树和 SQL 执行开始，沿着真实问题走进 InnoDB、PostgreSQL、事务、MVCC、Raft 与分布式 SQL。每种新能力，都从旧方法的局限中推导出来。
  actions:
    - { label: 从存储页开始, url: book/ch01-storage/, icon: fa-solid fa-book-open, style: primary }
    - { label: 查看完整路线, url: book/learning-path/, icon: fa-solid fa-arrow-right, style: ghost }

cards:
  eyebrow: 学习路径
  title: 从单机内核，一步步走到分布式数据库
  columns: 3
  items:
    - title: 已完成 · 存储、页与 B+ 树
      desc: 从记录如何落盘开始，看页、缓冲和 B+ 树怎样逐步解决读写与查找问题。
      icon: fa-solid fa-database
      url: book/ch01-storage/
    - title: 已完成 · 查询计划与执行器
      desc: 从 SQL 和代价估算继续走到执行器，跟踪数据怎样经过算子成为结果行。
      icon: fa-solid fa-diagram-project
      url: book/ch04-executor/
    - title: 已完成 · WAL 与崩溃恢复
      desc: 从一次跨两行的转账开始，推导日志先行、redo、undo 和检查点各自解决的问题。
      icon: fa-solid fa-clock-rotate-left
      url: book/ch05-recovery/
    - title: 已完成 · 并发、锁与隔离
      desc: 从丢失更新和写偏斜出发，理解行锁保护什么、死锁怎样产生，以及隔离级别承诺什么。
      icon: fa-solid fa-lock
      url: book/ch06-locking/
    - title: 后续 · MySQL、PostgreSQL 与 TiDB
      desc: 继续从 InnoDB 与 PostgreSQL 的事务、MVCC 走向 Raft 共识、分片和 TiDB 的分布式 SQL。
      icon: fa-solid fa-network-wired
      url: book/learning-path/

cta:
  title: 先从数据库最基础的问题开始。
  text: 一条记录如何落盘、查找为什么会变慢？从这里亲手重建数据库的核心抽象。
  label: 开始第一课
  url: book/ch01-storage/
  style: primary
