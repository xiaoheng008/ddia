outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  copyright:
    authors: Henry Xiao
    from_year: 2026
  footer_center_info: 采用 evo-learn 方法组织
  github_repo: https://github.com/xiaoheng008/ddia
  github_branch: main
  ui:
    dark_mode: true
    sidebar_menu_foldable: true
    sidebar_headings: 3
    backlinks: true

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1
