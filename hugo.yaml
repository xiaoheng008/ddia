title: 数据库系统：从单机内核到分布式一致性
baseURL: https://xiaoheng008.github.io/ddia/
defaultContentLanguage: zh
enableGitInfo: true
enableRobotsTXT: true
timeZone: Asia/Shanghai

languages:
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 1
    title: 数据库系统：从单机内核到分布式一致性
    hasCJKLanguage: true
